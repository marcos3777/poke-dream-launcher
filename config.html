<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Config</title>
<style>
  :root{ --bg:#111621; --panel2:#161c2a; --line:#1f2734; --line2:#2c3648; --txt:#e7e9ef; --mut:#8791a4; --gold:#ffce56; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif; font-size:12.5px;
    color-scheme:dark; padding:12px; border:1px solid var(--line2); border-radius:12px; overflow:hidden; }
  button{ font-family:inherit; cursor:pointer; }
  .h{ display:flex; align-items:center; margin-bottom:10px; }
  .h .t{ font-weight:800; font-size:13px; }
  .h .x{ margin-left:auto; width:26px; height:24px; border-radius:7px; border:1px solid var(--line2); background:transparent; color:var(--mut); font-size:13px; }
  .h .x:hover{ color:#fff; background:#7a2130; border-color:#7a2130; }
  .row{ color:var(--mut); margin-bottom:11px; } .row b{ color:var(--txt); }
  .btn{ width:100%; height:31px; border-radius:8px; border:1px solid var(--line2); background:var(--panel2); color:var(--txt); font-size:12px; margin-bottom:8px; }
  .btn:hover{ background:#1a2231; } .btn.on{ border-color:var(--gold); color:var(--gold); }
  .status{ font-size:11px; color:var(--mut); min-height:16px; line-height:1.45; }
  .sep{ border-top:1px solid var(--line2); margin:12px 0 10px; }
  .chk{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--txt); margin-bottom:9px; cursor:pointer; }
  .chk input{ cursor:pointer; }
  .cl-panel{ position:absolute; inset:0; background:var(--bg); border:1px solid var(--line2); border-radius:12px; padding:12px; display:none; flex-direction:column; }
  .cl-panel.show{ display:flex; }
  .cl-body{ flex:1; overflow-y:auto; margin-top:4px; }
  .cl-v{ margin-bottom:13px; }
  .cl-ver{ font-weight:800; font-size:12.5px; color:var(--gold); margin-bottom:4px; }
  .cl-date{ font-weight:400; font-size:9.5px; color:var(--mut); }
  .cl-body ul{ margin:0; padding-left:16px; }
  .cl-body li{ font-size:11px; color:var(--txt); margin-bottom:3px; line-height:1.35; }
  .cl-empty{ color:var(--mut); font-size:11px; }
</style>
</head>
<body>
  <div class="h"><span class="t">⚙ Configuracoes</span><button class="x" id="x" title="Fechar">✕</button></div>
  <div class="row">Versao instalada: <b id="ver">—</b></div>
  <button class="btn" id="changelog-btn">📋 Novidades (o que mudou)</button>
  <button class="btn" id="check">🔄 Verificar atualizacao</button>
  <button class="btn on" id="install" style="display:none">↻ Reiniciar e instalar</button>
  <div class="status" id="status"></div>

  <div class="sep"></div>
  <label class="chk" title="Envia so a versao do app e o sistema operacional, de forma anonima. Nao coleta login, senha nem dados do jogo."><input type="checkbox" id="telemetry"> 📊 Enviar uso anonimo (versao/OS)</label>
  <div class="status" style="margin-top:-4px">Ajuda a saber quantas pessoas usam o app e em qual versao. Anonimo, sem login/senha. Pode desligar aqui.</div>

  <div class="sep"></div>
  <label class="chk" title="Grava os frames de rede (WebSocket + respostas /api/) num arquivo, pra analisar o que o jogo manda."><input type="checkbox" id="diag"> 🛠 Gravar dump de diagnostico</label>
  <button class="btn" id="dumpfolder">📂 Abrir pasta do dump</button>
  <div class="status" id="diag-status"></div>

  <div class="cl-panel" id="changelog">
    <div class="h"><button class="x" id="cl-back" title="Voltar" style="margin-left:0;margin-right:8px">←</button><span class="t">📋 Novidades</span></div>
    <div class="cl-body" id="cl-body">carregando…</div>
  </div>
<script>
  const P = window.poke || null;
  const statusEl = document.getElementById('status');
  const install = document.getElementById('install');
  function setStatus(t){ statusEl.textContent = t || ''; }

  document.getElementById('x').onclick = function(){ if (P && P.closeConfig) P.closeConfig(); };
  if (P && P.getVersion) P.getVersion().then(function(v){ document.getElementById('ver').textContent = v; });

  document.getElementById('check').onclick = function(){
    if (!P || !P.checkForUpdate) return;
    install.style.display = 'none';
    setStatus('Verificando atualizacao…');
    P.checkForUpdate();
  };
  install.onclick = function(){ if (P && P.installUpdate) P.installUpdate(); };

  // ---- telemetria (uso anonimo) ----
  const telemetry = document.getElementById('telemetry');
  if (P && P.getTelemetry) P.getTelemetry().then(function(on){ telemetry.checked = on !== false; });
  telemetry.onchange = function(){ if (P && P.setTelemetry) P.setTelemetry(telemetry.checked); };

  // ---- diagnostico (dump) ----
  const diag = document.getElementById('diag');
  const diagStatus = document.getElementById('diag-status');
  if (P && P.getDiag) P.getDiag().then(function(on){ diag.checked = !!on; });
  diag.onchange = function(){
    if (!P || !P.setDiag) return;
    P.setDiag(diag.checked);
    diagStatus.textContent = diag.checked
      ? 'Gravando… abra/jogue o que quer capturar, depois desligue e abra a pasta.'
      : 'Parado. Clique em "Abrir pasta do dump" pra pegar o arquivo.';
  };
  document.getElementById('dumpfolder').onclick = function(){ if (P && P.openDumpFolder) P.openDumpFolder(); };

  // ---- novidades (changelog) ----
  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }
  const changelog = document.getElementById('changelog');
  const clBody = document.getElementById('cl-body');
  document.getElementById('changelog-btn').onclick = function(){
    changelog.classList.add('show');
    clBody.innerHTML = 'carregando…';
    if (!P || !P.getChangelog) { clBody.innerHTML = '<div class="cl-empty">Indisponivel.</div>'; return; }
    P.getChangelog().then(function(list){
      clBody.innerHTML = (list && list.length) ? list.map(function(v){
        return '<div class="cl-v"><div class="cl-ver">v'+esc(v.version)+(v.date?' <span class="cl-date">'+esc(v.date)+'</span>':'')+'</div><ul>'+
          (v.changes||[]).map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('')+'</ul></div>';
      }).join('') : '<div class="cl-empty">Sem novidades ainda.</div>';
    }).catch(function(){ clBody.innerHTML = '<div class="cl-empty">Nao consegui carregar as novidades.</div>'; });
  };
  document.getElementById('cl-back').onclick = function(){ changelog.classList.remove('show'); };

  if (P && P.onUpdateStatus) P.onUpdateStatus(function(s){
    if (!s) return;
    if (s.state === 'checking') setStatus('Verificando atualizacao…');
    else if (s.state === 'none') { setStatus('✅ Voce ja esta na versao mais recente.'); install.style.display = 'none'; }
    else if (s.state === 'available') setStatus('Versao ' + (s.version || '') + ' encontrada — baixando…');
    else if (s.state === 'downloading') setStatus('Baixando atualizacao… ' + (s.percent || 0) + '%');
    else if (s.state === 'downloaded') { setStatus('✅ Versao ' + (s.version || '') + ' baixada!'); install.style.display = 'block'; }
    else if (s.state === 'error') { setStatus('❌ ' + (s.message || 'erro ao verificar')); install.style.display = 'none'; }
  });
</script>
</body>
</html>
