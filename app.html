<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>PokeDream Launcher</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#111621; --panel2:#161c2a;
    --line:#1f2734; --line2:#2c3648;
    --txt:#e7e9ef; --mut:#8791a4; --gold:#ffce56; --good:#3fca74; --warn:#ffb151;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased; color-scheme:dark; overflow:hidden; }
  .app{ display:flex; flex-direction:column; height:100vh; }
  button{ font-family:inherit; cursor:pointer; }

  .bar{ height:46px; flex:0 0 46px; display:flex; align-items:center; gap:10px; padding:0 8px 0 14px;
    background:var(--panel); border-bottom:1px solid var(--line); -webkit-app-region:drag; z-index:20; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.3px; font-size:13px; }
  .brand .logo{ width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 50% 33%, #fff 0 25%, #ee4b4b 26% 48%, #17171a 49% 55%, #dcdcdc 56%); box-shadow:0 0 0 1.5px #17171a inset; }
  .brand b{ color:var(--gold); }
  .ver{ font-size:10.5px; font-weight:700; color:var(--mut); background:var(--panel2); border:1px solid var(--line2); padding:1px 7px; border-radius:8px; letter-spacing:0; }
  .bar .sp{ flex:1; }
  .bar button{ -webkit-app-region:no-drag; }
  .tbtn{ height:30px; padding:0 11px; display:flex; align-items:center; gap:6px; border-radius:8px;
    border:1px solid var(--line2); background:var(--panel2); color:var(--txt); font-size:12px; }
  .tbtn:hover{ background:#1a2231; } .tbtn.on{ border-color:var(--gold); color:var(--gold); }
  .ico{ width:32px; height:30px; border:1px solid var(--line); background:transparent; color:var(--mut); border-radius:8px; font-size:14px; }
  .ico:hover{ background:#1a2231; color:var(--txt); } .ico.cl:hover{ background:#7a2130; color:#fff; }

  .body{ display:flex; flex:1; min-height:0; }
  .side{ flex:0 0 220px; border-right:1px solid var(--line); background:#0d121b; padding:12px 10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  body.side-off .side{ display:none; }
  body.side-off #btn-side{ color:var(--gold); border-color:var(--gold); }
  .side-h{ display:flex; align-items:baseline; justify-content:space-between; padding:2px 4px 6px; }
  .side-h .t{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); font-weight:700; }
  .side-h .s{ font-size:10.5px; color:#5a6478; }
  .acc-list{ display:flex; flex-direction:column; gap:8px; margin-top:4px; flex:1 1 auto; overflow-y:auto; }
  .acc{ display:flex; flex-direction:column; align-items:stretch; gap:5px; padding:8px 9px 9px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--txt); cursor:pointer; text-align:left;
    font-size:12.5px; font-weight:700; width:100%; transition:border-color .15s,background .15s; }
  .acc:hover{ background:#1a2231; } .acc.on{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; background:#1a1e0b; }
  .acc-wrap.dragging{ opacity:.4; }
  .acc-wrap.drag-over .acc{ border-color:var(--gold); box-shadow:0 -2px 0 var(--gold) inset; }
  .acc.low, .acc.low.on{ border-color:#e5484d; box-shadow:0 0 0 1px #e5484d inset, 0 0 9px rgba(229,72,77,.30); }  /* alerta de item baixo */
  .acc-top{ display:flex; align-items:center; gap:4px; }
  .acc-body{ display:flex; align-items:center; gap:8px; }
  .acc-sprites{ position:relative; width:64px; height:54px; flex:0 0 64px; }
  .acc-spr{ position:absolute; right:0; bottom:0; width:54px; height:54px; object-fit:contain; image-rendering:pixelated; z-index:2; }
  .acc-spr.ph{ right:0; bottom:0; width:54px; height:54px; background:var(--panel2); border-radius:8px; border:1px solid var(--line2); }
  .acc-spr2{ position:absolute; left:0; bottom:1px; width:38px; height:38px; object-fit:contain; image-rendering:pixelated; z-index:1; opacity:.6; filter:brightness(.78); }
  .acc-info{ min-width:0; flex:1 1 auto; display:flex; flex-direction:column; gap:2px; }
  .acc-name{ flex:1 1 auto; min-width:0; font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acc-sub{ font-weight:400; font-size:11px; color:var(--mut); line-height:1.25; overflow-wrap:anywhere; }
  .acc-sub.shiny{ color:var(--gold); font-weight:700; }
  .acc-p2{ font-weight:400; font-size:9.5px; color:#7b8698; line-height:1.25; overflow-wrap:anywhere; }
  .acc-p2 b{ color:#7b8698; font-weight:700; }
  .acc-hunt{ font-weight:400; font-size:10px; color:#5a6478; line-height:1.25; overflow-wrap:anywhere; }
  .acc-reload{ flex:0 0 auto; color:var(--mut); font-size:15px; padding:2px 5px; border-radius:6px; opacity:0; transition:opacity .12s,color .12s; }
  .acc:hover .acc-reload{ opacity:.85; }
  .acc-reload:hover{ color:var(--warn); background:var(--panel2); opacity:1; }
  .addacc{ margin-top:6px; padding:9px; border-radius:9px; border:1px dashed var(--line2);
    background:transparent; color:var(--mut); font-size:12px; width:100%; }
  .addacc:hover{ color:var(--gold); border-color:var(--gold); }
  .gcbtn{ background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:5px 8px; font-size:10.5px; cursor:pointer; width:100%; text-align:center; }
  .gcbtn:hover{ background:#1a2231; border-color:var(--line2); }
  .game-ctrls{ display:flex; flex-direction:column; gap:5px; margin:2px 0 8px; }
  .focus-info{ font-size:10.5px; color:var(--good); padding:6px 8px; border-radius:7px; background:#132216; border:1px solid #1f3a27; margin-top:4px; line-height:1.4; }
  .focus-info b{ color:var(--gold); }

  .main{ flex:1; min-width:0; padding:12px; display:flex; align-items:center; justify-content:center; }
  .empty{ color:var(--mut); font-size:13px; text-align:center; }
  .empty b{ color:var(--gold); }
  .box-wrap{ display:flex; flex-direction:column; width:100%; height:100%; }
  .box-top{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-bottom:9px; border-bottom:1px solid var(--line); flex:0 0 auto; }
  .box-top b{ font-size:14px; }
  .box-top label{ font-size:11.5px; color:var(--mut); display:flex; align-items:center; gap:5px; cursor:pointer; }
  .box-top select{ background:var(--panel2); color:var(--txt); border:1px solid var(--line2); border-radius:7px; padding:4px 8px; font-size:11.5px; outline:none; }
  .box-count{ color:var(--gold); font-size:11px; font-weight:700; }
  .mclose{ margin-left:auto; }
  .box-sort{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; padding:9px 0 4px; flex:0 0 auto; }
  .box-sort .lbl{ color:var(--mut); font-size:10px; text-transform:uppercase; letter-spacing:.5px; margin-right:2px; }
  .sbtn{ background:var(--panel2); border:1px solid var(--line2); color:var(--mut); border-radius:999px; padding:4px 12px; font-size:11px; cursor:pointer; }
  .sbtn:hover{ color:var(--txt); border-color:var(--line2); }
  .sbtn.on{ background:var(--gold); color:#1a1205; border-color:var(--gold); font-weight:700; }
  .box-zoom{ display:flex; align-items:center; gap:6px; color:var(--mut); font-size:12px; }
  .box-zoom input[type=range]{ width:96px; accent-color:var(--gold); cursor:pointer; }
  .box-scroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; margin-top:6px; }
  .box-grid{ display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; padding:4px 2px 12px; }
  .box-cell{ width:var(--cell,84px); height:var(--cell,84px); border-radius:11px; background:#10141d; border:1px solid var(--line2); display:flex; flex-direction:column; align-items:center; position:relative; cursor:grab; padding:4px 3px; overflow:hidden; }
  .box-cell:hover{ filter:brightness(1.3); border-color:#3a4762; }
  .box-cell.dragging{ opacity:.3; cursor:grabbing; }
  .box-cell.over{ outline:2px dashed var(--gold); outline-offset:2px; }
  .box-cell img{ width:calc(var(--cell,84px) - 40px); height:calc(var(--cell,84px) - 40px); image-rendering:pixelated; pointer-events:none; margin:auto 0; }
  .box-num{ align-self:flex-start; font-size:8.5px; line-height:1; color:var(--mut); font-weight:700; font-variant-numeric:tabular-nums; pointer-events:none; }
  .box-name{ max-width:100%; font-size:8.5px; line-height:1.15; color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; pointer-events:none; }
  .box-name.shiny{ color:var(--gold); }
  .box-cell .sh{ position:absolute; top:2px; right:3px; font-size:10px; pointer-events:none; }
  .box-tip{ position:fixed; z-index:60; pointer-events:none; background:#0d1119; border:1px solid var(--line2); border-radius:9px; padding:8px 11px; font-size:11px; color:var(--txt); box-shadow:0 8px 24px rgba(0,0,0,.55); display:none; min-width:118px; }
  .box-tip .tn{ font-weight:800; font-size:12px; margin-bottom:4px; }
  .box-tip .tr{ color:var(--mut); line-height:1.5; }
  .box-tip .tr b{ color:var(--txt); font-weight:700; }
  .box-shiny{ color:var(--gold); font-weight:700; }

  /* ---- Pokédex (grade de todos os pokes: capturados em destaque, faltando esmaecidos) ---- */
  .dex-region{ display:flex; gap:6px; align-items:center; }
  .dex-region .lbl{ color:var(--mut); font-size:10px; text-transform:uppercase; letter-spacing:.5px; margin-right:2px; }
  .dex-grid{ display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start; padding:4px 2px 12px; }
  .dex-cell{ width:var(--cell,84px); height:var(--cell,84px); border-radius:11px; background:#10141d; border:1px solid var(--line2); display:flex; flex-direction:column; align-items:center; position:relative; padding:4px 3px; overflow:hidden; transition:filter .12s, opacity .12s; }
  .dex-cell img{ width:calc(var(--cell,84px) - 40px); height:calc(var(--cell,84px) - 40px); image-rendering:pixelated; pointer-events:none; margin:auto 0; }
  .dex-cell:hover{ filter:brightness(1.25); border-color:#3a4762; }
  .dex-cell.has{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; background:#181c10; }
  .dex-cell:not(.has){ opacity:.34; }
  .dex-cell:not(.has) img{ filter:grayscale(1) brightness(.5); }
  .dex-cell:not(.has) .box-name{ color:var(--mut); }
  .dex-cell:not(.has):hover{ opacity:.85; }

  /* ---- Itens (Suprimentos) logo abaixo de cada card: mini-cards com número + ícone + label ---- */
  .acc-wrap{ display:flex; flex-direction:column; gap:5px; cursor:grab; }
  .acc-wrap:active{ cursor:grabbing; }
  .acc-items{ display:grid; grid-template-columns:repeat(3,1fr); gap:4px; padding:0 1px; }
  .itc{ background:var(--panel2); border:1px solid var(--line2); border-radius:8px; padding:4px 3px; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:0; }
  .itc .top{ display:flex; align-items:center; gap:3px; }
  .itc img{ width:17px; height:17px; image-rendering:pixelated; flex:0 0 auto; }
  .itc .v{ font-size:11.5px; font-weight:800; color:var(--txt); font-variant-numeric:tabular-nums; line-height:1; }
  .itc .l{ font-size:8px; letter-spacing:.3px; text-transform:uppercase; color:var(--mut); font-weight:700; }
  .itc.z{ opacity:.5; }
  .itc.z .v{ color:var(--mut); }
  .itc.low{ opacity:1; border-color:#e5484d; background:#2a1416; }
  .itc.low .v{ color:#ff6b6f; }

  /* ---- Stats (painel de estatísticas por conta) ---- */
  .st-scroll{ flex:1 1 auto; overflow-y:auto; overflow-x:hidden; margin-top:10px; padding-right:2px; }
  .st-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:12px; padding-bottom:14px; }
  .st-card{ background:linear-gradient(160deg,#141a26 0%,#10141d 100%); border:1px solid var(--line2); border-radius:14px; padding:13px 14px 12px; }
  .st-card.total{ border-color:#3a4762; background:linear-gradient(160deg,#181d2b 0%,#121724 100%); }
  .st-head{ display:flex; align-items:center; gap:8px; margin-bottom:11px; }
  .st-head .nm{ font-size:13.5px; font-weight:800; color:var(--txt); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st-head .lv{ font-size:9.5px; color:var(--mut); background:var(--panel2); border:1px solid var(--line); border-radius:20px; padding:2px 8px; font-weight:700; white-space:nowrap; }
  .st-head .sess{ margin-left:auto; font-size:9.5px; color:var(--mut); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .st-tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:7px; }
  .st-t{ background:#0d1119; border:1px solid var(--line); border-radius:10px; padding:7px 8px; min-width:0; }
  .st-t .k{ font-size:8.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--mut); font-weight:700; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .st-t .n{ font-size:15px; font-weight:800; color:var(--txt); font-variant-numeric:tabular-nums; line-height:1.1; }
  .st-t .r{ font-size:9px; color:#5f6b80; font-variant-numeric:tabular-nums; margin-top:2px; }
  .st-t .r b{ color:var(--gold); font-weight:700; }
  .st-t.gold .n{ color:var(--gold); }
  .st-t.shiny{ border-color:#3b3517; background:#151308; }
  .st-dex{ margin-top:9px; }
  .st-dex .lbl{ display:flex; justify-content:space-between; font-size:9.5px; color:var(--mut); font-weight:700; margin-bottom:4px; }
  .st-dex .lbl b{ color:var(--txt); font-variant-numeric:tabular-nums; }
  .st-bar{ height:6px; border-radius:6px; background:#0d1119; border:1px solid var(--line); overflow:hidden; }
  .st-bar > span{ display:block; height:100%; background:linear-gradient(90deg,#ffce56,#ff9f43); }
  .st-bar.sh > span{ background:linear-gradient(90deg,#8ab4ff,#5f8dd6); }
  .st-foot{ margin-top:9px; padding-top:8px; border-top:1px solid var(--line); font-size:10px; color:var(--mut); line-height:1.55; }
  .st-foot b{ color:var(--txt); font-weight:700; font-variant-numeric:tabular-nums; }
  .st-foot .warn b{ color:#ff8a3d; }
  .st-foot .hd{ font-size:10.5px; color:var(--txt); margin-bottom:3px; }
  .st-foot .hd b{ color:var(--gold); }
  .st-foot .hd .ago{ color:#5f6b80; font-weight:400; }
  .st-empty{ color:var(--mut); font-size:12px; padding:14px 2px; }

  /* ---- botão "+" (histórico da espécie) nos cards da Box/Pokédex e no card de Stats ---- */
  .hl-btn{ position:absolute; top:2px; right:3px; width:15px; height:15px; border-radius:5px; border:1px solid var(--line2);
    background:#0d1119; color:var(--mut); font-size:11px; line-height:13px; text-align:center; font-weight:800;
    cursor:pointer; opacity:0; transition:opacity .12s,color .12s,border-color .12s; z-index:3; }
  .box-cell:hover .hl-btn, .dex-cell:hover .hl-btn{ opacity:1; }
  .box-cell:hover .sh{ opacity:0; }   /* o ✨ e o + dividem o canto — no hover mostra só o + */
  .hl-btn:hover{ color:var(--gold); border-color:var(--gold); background:#1a1e0b; }
  .st-foot .hl-btn{ position:static; display:inline-block; opacity:.75; margin-left:5px; vertical-align:middle; }
  .st-foot .hl-btn:hover{ opacity:1; }

  /* ---- modal do histórico acumulado da espécie ---- */
  .hl-back{ position:fixed; inset:0; background:rgba(6,9,14,.68); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px; }
  .hl-modal{ width:min(400px,100%); max-height:100%; overflow-y:auto; background:linear-gradient(160deg,#161c2a 0%,#11151f 100%);
    border:1px solid var(--line2); border-radius:16px; padding:16px 17px 15px; box-shadow:0 18px 50px rgba(0,0,0,.6); }
  .hl-h{ display:flex; align-items:center; gap:11px; margin-bottom:13px; }
  .hl-h img{ width:52px; height:52px; image-rendering:pixelated; flex:0 0 52px; }
  .hl-h .t{ min-width:0; flex:1 1 auto; }
  .hl-h .sp{ font-size:15px; font-weight:800; color:var(--txt); line-height:1.2; }
  .hl-h .su{ font-size:10px; color:var(--mut); font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
  .hl-h .x{ flex:0 0 auto; width:25px; height:24px; border-radius:7px; border:1px solid var(--line2); background:transparent; color:var(--mut); font-size:12px; cursor:pointer; }
  .hl-h .x:hover{ color:#fff; background:#7a2130; border-color:#7a2130; }
  .hl-tiles{ display:grid; grid-template-columns:repeat(2,1fr); gap:7px; margin-bottom:12px; }
  .hl-sec{ font-size:9.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); font-weight:800; margin:0 0 7px; }
  .hl-ball{ display:flex; align-items:center; gap:9px; background:#0d1119; border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px; }
  .hl-ball img{ width:20px; height:20px; image-rendering:pixelated; flex:0 0 20px; }
  .hl-ball .bn{ font-size:11px; font-weight:700; color:var(--txt); flex:1 1 auto; min-width:0; }
  .hl-ball .bn small{ display:block; font-size:9px; color:var(--mut); font-weight:400; }
  .hl-ball .bp{ font-size:14px; font-weight:800; color:var(--gold); font-variant-numeric:tabular-nums; }
  .hl-ball.off .bp{ color:var(--line2); }
  .hl-ball.cmp{ display:block; padding:9px 10px 8px; }
  .hl-ball-head{ display:flex; align-items:center; gap:9px; margin-bottom:6px; }
  .hl-ball-head .bn{ flex:1 1 auto; }
  .hl-cmp-r{ display:grid; grid-template-columns:72px 1fr auto; align-items:baseline; gap:7px; padding:4px 1px 3px 29px;
    border-top:1px solid rgba(31,39,52,.72); font-size:10px; }
  .hl-cmp-r .who{ color:var(--txt); font-weight:700; }
  .hl-cmp-r .sample{ min-width:0; color:var(--mut); font-size:9px; line-height:1.35; }
  .hl-cmp-r .pct{ color:var(--gold); font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hl-cmp-r.community .who, .hl-cmp-r.community .pct{ color:#aeb8ca; }
  .hl-community{ margin:0 0 12px; padding:9px 10px; border:1px solid rgba(58,72,94,.72); border-radius:10px; background:rgba(13,17,25,.58); }
  .hl-community .hc-top{ display:flex; align-items:baseline; gap:8px; margin-bottom:4px; }
  .hl-community .hc-top b{ color:#b8c2d3; font-size:10.5px; }
  .hl-community .hc-top span{ margin-left:auto; color:#6f7b91; font-size:9px; }
  .hl-community .hc-main{ color:var(--txt); font-size:10.5px; line-height:1.5; }
  .hl-community .hc-main strong{ color:#c5cddd; font-size:12px; }
  .hl-community .hc-sub{ color:var(--mut); font-size:9.5px; line-height:1.45; }
  .hl-empty{ color:var(--mut); font-size:11.5px; line-height:1.6; padding:6px 2px 2px; }
  .hl-empty.local{ margin-bottom:11px; padding:8px 10px; border:1px dashed rgba(58,72,94,.65); border-radius:9px; background:rgba(13,17,25,.35); }
  /* linhas técnicas: rótulo à esquerda, número à direita */
  .hl-rows{ margin-bottom:12px; }
  .hl-r{ display:flex; align-items:baseline; gap:8px; font-size:11px; padding:3px 2px; border-bottom:1px solid rgba(31,39,52,.6); }
  .hl-r:last-child{ border-bottom:0; }
  .hl-r .lb{ color:var(--mut); flex:1 1 auto; min-width:0; }
  .hl-r .vl{ color:var(--txt); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .hl-r .vl.g{ color:var(--gold); }
  .hl-r .vl.dim{ color:var(--line2); }
  .hl-r .un{ color:var(--mut); font-weight:400; font-size:9.5px; }
  .hl-note{ font-size:9.5px; color:#5f6b80; line-height:1.5; padding:2px 2px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="ico" id="btn-side" title="Esconder/mostrar a barra lateral">☰</button>
    <span class="brand"><span class="logo"></span>POKEDREAM <b>LAUNCHER</b> <span class="ver" id="app-ver">…</span></span>
    <span class="sp"></span>
    <button class="tbtn" id="btn-grid" style="display:none">▦ Grade</button>
    <button class="tbtn" id="btn-box">📦 Box</button>
    <button class="tbtn" id="btn-dex">📘 Pokédex</button>
    <button class="tbtn" id="btn-stats">📊 Stats</button>
    <button class="tbtn" id="btn-add">+ Adicionar tela</button>
    <button class="ico" id="btn-cfg" title="Configuracoes / Atualizacao">⚙</button>
    <button class="ico" id="btn-min">—</button>
    <button class="ico" id="btn-max">□</button>
    <button class="ico cl" id="btn-close">✕</button>
  </div>
  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>

  function spr(name, shiny){ const d = name && DEX_MAP[name]; return d ? 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/' + (shiny ? 'shiny/' : '') + d + '.gif' : ''; }

  // ---- Pokédex: grade de TODOS os pokes do jogo; capturados em destaque, faltando esmaecidos ----

  let dexOpen = false, dexRegion = 'all', dexMissing = false, dexShiny = false;

  function dexCounts(){
    const cnt = {}, shiny = {};

  function hlTile(k, n, cls){ return '<div class="st-t'+(cls?' '+cls:'')+'"><div class="k">'+k+'</div><div class="n">'+n+'</div></div>'; }

    const cm = community ? {
      contributors:numVal(community.contributors), kills:numVal(community.kills), caught:numVal(community.caught),
      shinies:numVal(community.shinies), thrownA:numVal(community.thrown_a), thrownB:numVal(community.thrown_b),
      caughtA:numVal(community.caught_a), caughtB:numVal(community.caught_b), ms:numVal(community.ms),
      catchPct:community.catch_pct, catchPctA:community.catch_pct_a, catchPctB:community.catch_pct_b,
      killsPerShiny:numVal(community.kills_per_shiny)
    } : null;
    const hasLocal = Object.keys(local).some(function(k){ return local[k] > 0; });
    const hasCommunity = !!(cm && (cm.contributors || cm.kills || cm.caught || cm.thrownA || cm.thrownB));
    const spr = sprStatic(sp, false);
    const head = '<div class="hl-h">'
      + (spr ? '<img src="'+spr+'" alt="" onerror="this.style.display=\'none\'">' : '')
      + '<div class="t"><div class="sp">'+esc(sp)+'</div><div class="su">'+(hasCommunity ? 'seus números e comunidade' : 'histórico acumulado')+'</div></div>'
      + '<button class="x" id="hl-x" title="Fechar">✕</button></div>';
    if (loadError) return head + '<div class="hl-empty">Não foi possível carregar as estatísticas agora. Confira sua conexão e tente novamente em instantes.</div>';
    if (!hasLocal && !hasCommunity) {
      // sem histórico ainda — mas o streak vem do jogo e já vale mostrar
      const st0 = (d.streaks || []).filter(function(x){ return x && x.balls != null; });
      const row0 = (lb, vl, cls) => '<div class="hl-r"><span class="lb">'+lb+'</span><span class="vl'+(cls?' '+cls:'')+'">'+vl+'</span></div>';
      return head + '<div class="hl-empty">Ainda não há histórico para <b>'+esc(sp)+'</b>.<br>Assim que você caçar essa espécie com o launcher aberto, os números aparecem aqui e vão se acumulando.</div>'
        + (st0.length ? '<div class="hl-sec" style="margin-top:12px">Streak atual — bolas sem capturar</div><div class="hl-rows">'
            + st0.map(function(x){ return row0(esc(x.name) + (x.hunting ? ' <span class="un">· caçando agora</span>' : ''), fmtInt(x.balls), x.balls ? 'g' : 'dim'); }).join('')
          + '</div>' : '');
    }
    const thrown = local.thrownA + local.thrownB;
    const localIntro = hasLocal ? '' : '<div class="hl-empty local">Você ainda não tem histórico local desta espécie. A amostra comunitária já pode ser consultada abaixo.</div>';
    const tiles = hasLocal ? '<div class="hl-tiles">'
      + hlTile('Tempo caçando', fmtDur(local.ms))
      + hlTile('Encontros', fmtInt(local.kills))
      + hlTile('Capturas', fmtInt(local.caught) + ' <span style="font-size:10px;color:var(--mut)">('+pctTxt(local.caught, local.kills)+')</span>')
      + hlTile('Shinies', fmtInt(local.shinies), 'shiny gold')
      + '</div>' : '';

    const communitySummary = hasCommunity ? '<div class="hl-community">'
      + '<div class="hc-top"><b>Amostra da comunidade</b><span>'+contributorsTxt(cm.contributors)+'</span></div>'
      + '<div class="hc-main"><strong>'+fmtInt(Math.round(cm.kills))+'</strong> encontros · <strong>'+fmtInt(Math.round(cm.caught))+'</strong> capturas <span class="un">('+pctValue(cm.catchPct, cm.caught, cm.kills)+')</span></div>'
      + '<div class="hc-sub">'+fmtInt(Math.round(cm.shinies))+' shinies encontrados/derrotados'
        + (cm.killsPerShiny ? ' · 1 a cada '+fmtInt(Math.round(cm.killsPerShiny))+' encontros' : '')
        + ' · '+fmtDur(cm.ms)+' de caçada somada</div>'
      + '</div>' : '';

    // "1 a cada N" — se ainda não houve o evento, mostra o que já se gastou sem ele
    const row = (lb, vl, cls) => '<div class="hl-r"><span class="lb">'+lb+'</span><span class="vl'+(cls?' '+cls:'')+'">'+vl+'</span></div>';
    const ratio = (tot, ev, un) => ev ? '1 <span class="un">a cada</span> ' + fmtInt(Math.round(tot / ev)) + ' <span class="un">'+un+'</span>' : '—';
    const props = hasLocal ? '<div class="hl-sec">Proporções</div><div class="hl-rows">'
      + row('Captura', ratio(local.kills, local.caught, 'encontros'), 'g')
      + row('Shiny', ratio(local.kills, local.shinies, 'encontros'), 'g')
      + row('Sem shiny há', fmtInt(local.dryBalls) + ' <span class="un">bolas</span>', local.dryBalls ? 'g' : 'dim')
      + row('Bolas por captura', local.caught ? (Math.round(thrown / local.caught * 10) / 10).toLocaleString('pt-BR') : '—')
      + row('Bolas por encontro', local.kills ? (Math.round(thrown / local.kills * 100) / 100).toLocaleString('pt-BR') : '—')
      + row('Total de bolas jogadas', fmtInt(thrown))
      + (!local.shinies && thrown ? row('Bolas jogadas sem nenhum shiny', fmtInt(thrown), 'dim') : '')
      + '</div>' : '';

    const perH = (n) => local.ms > 0 ? fmtInt(Math.round(n / (local.ms / 3600000))) + ' <span class="un">/h</span>' : '—';
    const rates = hasLocal ? '<div class="hl-sec">Por hora de caçada</div><div class="hl-rows">'
      + row('Encontros', perH(local.kills))
      + row('Capturas', perH(local.caught))
      + row('Shinies', local.shinies ? perH(local.shinies) : '<span class="dim">0 <span class="un">/h</span></span>', 'g')
      + row('Bolas gastas', perH(thrown))
      + '</div>' : '';

    const ball = (nome, sprite, localThrown, localCaught, communityThrown, communityCaught, communityPct, nota) => {
      const localOn = localThrown > 0, communityOn = hasCommunity && communityThrown > 0;
      return '<div class="hl-ball cmp'+(localOn || communityOn ? '' : ' off')+'">'
        + '<div class="hl-ball-head"><img src="'+sprItem(sprite)+'" alt="" onerror="this.style.display=\'none\'">'
        + '<span class="bn">'+nome+(nota ? '<small>'+nota+'</small>' : '')+'</span></div>'
        + '<div class="hl-cmp-r"><span class="who">Você</span><span class="sample">'+(localOn ? fmtInt(Math.round(localCaught))+' capturas em '+fmtInt(localThrown)+' bolas' : 'sem dados locais')+'</span><span class="pct">'+(localOn ? pctTxt(localCaught, localThrown) : '—')+'</span></div>'
        + (hasCommunity ? '<div class="hl-cmp-r community"><span class="who">Comunidade</span><span class="sample">'+(communityOn ? fmtInt(Math.round(communityCaught))+' capturas em '+fmtInt(communityThrown)+' bolas · '+contributorsTxt(cm.contributors) : 'sem amostra para esta bola')+'</span><span class="pct">'+(communityOn ? pctValue(communityPct, communityCaught, communityThrown) : '—')+'</span></div>' : '')
      + '</div>';
    };
    const balls = '<div class="hl-sec">Taxa de captura por bola</div>'
      + ball('Poke Ball', 'poke-ball', local.thrownA, local.caughtA, cm ? cm.thrownA : 0, cm ? cm.caughtA : 0, cm ? cm.catchPctA : null, '')
      + ball('Ultra / Premier', 'ultra-ball', local.thrownB, local.caughtB, cm ? cm.thrownB : 0, cm ? cm.caughtB : 0, cm ? cm.catchPctB : null, 'mesma chance');

    // streak: vem ao vivo do jogo (bolas gastas desde a última captura dessa espécie)
    const st = (d.streaks || []).filter(function(x){ return x && x.balls != null; });
    const streak = st.length ? '<div class="hl-sec" style="margin-top:12px">Streak atual — bolas sem capturar</div><div class="hl-rows">'
      + st.map(function(x){ return row(esc(x.name) + (x.hunting ? ' <span class="un">· caçando agora</span>' : ''), fmtInt(x.balls), x.balls ? 'g' : 'dim'); }).join('')
      + '</div>' : '';

    return head + localIntro + tiles + communitySummary + props + rates + balls + streak
      + '<div class="hl-note">Bolas locais são contadas pela queda na mochila; aumento é drop, não conta. Ultra e Premier somam por terem a mesma chance. A comunidade mostra somente dados agregados de colaboradores anônimos.</div>';
  }
  function openHuntLog(sp){
    if (!sp) return;
    hideTip(); closeHuntLog();
    hlBack = document.createElement('div');
    hlBack.className = 'hl-back';
    hlBack.innerHTML = '<div class="hl-modal"><div class="hl-empty">Carregando…</div></div>';
    document.body.appendChild(hlBack);
    hlBack.addEventListener('click', function(e){ if (e.target === hlBack) closeHuntLog(); });
    document.addEventListener('keydown', hlEsc);
    const fill = function(d, loadError){
      if (!hlBack) return;
      hlBack.querySelector('.hl-modal').innerHTML = huntLogHTML(sp, d, loadError);
      const x = hlBack.querySelector('#hl-x'); if (x) x.onclick = closeHuntLog;
    };
    if (P && P.getHuntLog) P.getHuntLog(sp).then(function(d){ fill(d, false); }).catch(function(){ fill(null, true); });
    else fill(null, true);
  }
  // liga os "+" (delegação: funciona pra Box, Pokédex e Stats sem religar a cada render)
  document.addEventListener('click', function(e){
    const b = e.target.closest && e.target.closest('.hl-btn');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    openHuntLog(b.dataset.sp);
  });

  // ---- Stats: totais do jogo + taxas desta sessão, por conta ----
  const DEX_TOTAL = DEX_LIST.length;   // espécies que o launcher conhece (Kanto+Johto)
  let statsOpen = false, statsTimer = null;
  function fmtInt(n){ return n == null ? '—' : (n).toLocaleString('pt-BR'); }
  function fmtDur(ms){
    const s = Math.floor((ms || 0) / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
    return h ? (h + 'h ' + String(m).padStart(2,'0') + 'm') : (m + 'm');
  }
  function rateTxt(v, suf){ return v == null ? '' : '<b>' + abbrN(v) + '</b>/h' + (suf || ''); }
  function tile(k, n, cls, rate){
    return '<div class="st-t'+(cls?' '+cls:'')+'"><div class="k">'+k+'</div><div class="n">'+n+'</div>'
      + (rate ? '<div class="r">'+rate+'</div>' : '') + '</div>';
  }
  function bar(cur, total, sh){
    const pct = total ? Math.min(Math.round((cur || 0) / total * 100), 100) : 0;
    return '<div class="st-bar'+(sh?' sh':'')+'"><span style="width:'+pct+'%"></span></div>';
  }
  function statCard(r, isTotal){
    const lv = !isTotal && (r.trainerLevel != null || r.activeLevel != null)
      ? '<span class="lv">Treinador <b style="color:var(--txt)">'+(r.trainerLevel != null ? r.trainerLevel : '—')+'</b> · Ativo Lv '+(r.activeLevel != null ? r.activeLevel : '—')+'</span>' : '';
    const sess = r.sessionMs ? '<span class="sess">⏱ '+fmtDur(r.sessionMs)+'</span>' : '';
    const ph = r.perHour || {};
    const dex = !isTotal ? '<div class="st-dex">'
        + '<div class="lbl"><span>Pokédex</span><b>'+fmtInt(r.species)+' / '+DEX_TOTAL+'</b></div>' + bar(r.species, DEX_TOTAL)
        + '<div class="lbl" style="margin-top:6px"><span>Shiny</span><b>'+fmtInt(r.shinySpecies)+' / '+DEX_TOTAL+'</b></div>' + bar(r.shinySpecies, DEX_TOTAL, true)
      + '</div>' : '';
    const h = r.hunt;
    const foot = !isTotal && h ? '<div class="st-foot">'
        + '<div class="hd">🗺 Caçada atual: <b>'+esc(h.species || titce(h.id || '—'))+'</b> <span class="ago">· '+fmtDur(h.ms)+'</span>'
          + (h.species ? '<span class="hl-btn" data-sp="'+esc(h.species)+'" title="Histórico acumulado dessa espécie">+</span>' : '') + '</div>'
        + '<div>⚔ <b>'+fmtInt(h.kills)+'</b> encontros · <b>'+fmtInt(h.caught)+'</b> capturas'
          + (h.catchRate != null ? ' (<b>'+h.catchRate+'%</b>)' : '') + '</div>'
        + '<div>✨ <b>'+fmtInt(h.shinies)+'</b> shiny' + (h.shinies === 1 ? '' : 's')
          + (h.shinyRatio ? ' · 1 a cada <b>'+fmtInt(h.shinyRatio)+'</b>' : '') + '</div>'
        + (h.ballsSince != null ? '<div class="warn">🎯 <b>'+fmtInt(h.ballsSince)+'</b> bolas desde a última captura</div>' : '')
      + '</div>' : '';
    return '<div class="st-card'+(isTotal?' total':'')+'">'
      + '<div class="st-head"><span class="nm">'+(isTotal ? '🏆 Todas as contas' : esc(r.name))+'</span>'+lv+sess+'</div>'
      + '<div class="st-tiles">'
        + tile('Capturas', fmtInt(r.caught), '', rateTxt(ph.caught))
        + tile('Shinies', fmtInt(r.shinies), 'shiny gold', rateTxt(ph.shinies))
        + tile('Encontros', fmtInt(r.kills), '', rateTxt(ph.kills))
        + tile('Dinheiro', fmtInt(r.money), 'gold', rateTxt(ph.money))
      + '</div>' + dex + foot
    + '</div>';
  }
  function sumStats(rows){
    const t = { caught:0, kills:0, shinies:0, money:0, sessionMs:0, perHour:{caught:0,kills:0,shinies:0,money:0} };
    let anyRate = false;
    rows.forEach(function(r){
      ['caught','kills','shinies','money'].forEach(function(k){ if (r[k] != null) t[k] += r[k]; });
      if (r.sessionMs > t.sessionMs) t.sessionMs = r.sessionMs;
      const ph = r.perHour || {};
      Object.keys(t.perHour).forEach(function(k){ if (ph[k] != null) { t.perHour[k] += ph[k]; anyRate = true; } });
    });
    if (!anyRate) t.perHour = {};
    return t;
  }
  function renderStats(rows){
    const main = document.getElementById('main');
    const body = rows.length
      ? '<div class="st-grid">' + (rows.length > 1 ? statCard(sumStats(rows), true) : '') + rows.map(function(r){ return statCard(r, false); }).join('') + '</div>'
      : '<div class="st-empty">Nenhuma tela aberta. Abra uma conta para ver as estatísticas.</div>';
    main.innerHTML =
      '<div class="box-wrap">'
        + '<div class="box-top">'
          + '<b>📊 Stats</b>'
          + '<span class="box-count">'+rows.length+(rows.length === 1 ? ' conta' : ' contas')+'</span>'
          + '<span style="font-size:10.5px;color:var(--mut)">as taxas /h são desta sessão · atualiza sozinho</span>'
        + '</div>'
        + '<div class="st-scroll">' + body + '</div>'
      + '</div>';
  }
  function loadStats(first){
    if (!P || !P.getStats) return;
    if (first) document.getElementById('main').innerHTML = '<div class="empty">Carregando estatísticas…</div>';
    P.getStats().then(function(d){ if (statsOpen) renderStats(d || []); })
      .catch(function(){ if (first) document.getElementById('main').innerHTML = '<div class="empty">Não consegui carregar as estatísticas.</div>'; });
  }
  // fecha só o estado do painel (sem mexer no setBoxOpen) — usado quando a Box/Pokédex assume o #main
  function closeStats(){
    statsOpen = false;
    document.getElementById('btn-stats').classList.remove('on');
    if (statsTimer){ clearInterval(statsTimer); statsTimer = null; }
  }
  function toggleStats(open){
    statsOpen = (open == null) ? !statsOpen : !!open;
    document.getElementById('btn-stats').classList.toggle('on', statsOpen);
    if (statsOpen){
      if (boxOpen){ boxOpen = false; document.getElementById('btn-box').classList.remove('on'); }
      if (dexOpen){ dexOpen = false; document.getElementById('btn-dex').classList.remove('on'); }
    }
    if (P && P.setBoxOpen) P.setBoxOpen(statsOpen);
    if (statsTimer){ clearInterval(statsTimer); statsTimer = null; }
    if (statsOpen){ loadStats(true); statsTimer = setInterval(function(){ loadStats(false); }, 5000); }   // ao vivo
    else { hideTip(); renderSidebar(); }
  }

  // ---- Suprimentos de cada conta, logo abaixo do card: mini-cards (linha 1 = balls, linha 2 = pot/revive) ----
  // [chave, label, sprite do item na PokeAPI]. Vem no payload de 'accounts'.
  const ITM_DEFS = [
    ['poke_ball','Poke','poke-ball'], ['ultra_ball','Ultra','ultra-ball'], ['premier_ball','Prem','premier-ball'],
    ['potion','Potion','potion'], ['revive','Revive','revive'],
  ];
  let itemVis = { poke_ball: true, ultra_ball: true, premier_ball: true, potion: true, revive: true };   // config (menu ⚙ > Itens)
  let itemAlert = { poke_ball: 2000, ultra_ball: 2000, premier_ball: 2000, potion: 2000, revive: 500 };  // limite p/ borda vermelha (0 = off)
  function sprItem(name){ return 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/' + name + '.png'; }
  function abbrN(n){ n = n || 0; if (n >= 1e6) return (n/1e6).toFixed(1).replace('.',',') + 'M'; if (n >= 1e3) return (n/1e3).toFixed(1).replace('.',',') + 'k'; return String(n); }
  function isLow(key, v){ const t = itemAlert[key] || 0; return t > 0 && (v || 0) < t; }   // abaixo do limite configurado
  // itens visíveis que estão baixos numa conta -> usados pra borda vermelha do card + tooltip
  function accLowItems(inf){
    const it = inf && inf.items; if (!it) return [];
    return ITM_DEFS.filter(function(c){ return itemVis[c[0]] !== false && isLow(c[0], it[c[0]]); }).map(function(c){ return c[1]; });
  }
  function itemsForAcc(inf){
    const it = inf && inf.items; if (!it) return '';
    const defs = ITM_DEFS.filter(function(c){ return itemVis[c[0]] !== false; });
    if (!defs.length) return '';
    const cards = defs.map(function(c){
      const v = it[c[0]] || 0, lo = isLow(c[0], v);
      return '<div class="itc'+(v?'':' z')+(lo?' low':'')+'" title="'+c[1]+': '+v.toLocaleString('pt-BR')+(lo?' — baixo!':'')+'">'
        + '<span class="top"><img src="'+sprItem(c[2])+'" alt="" loading="lazy" onerror="this.style.display=\'none\'"><span class="v">'+abbrN(v)+'</span></span>'
        + '<span class="l">'+c[1]+'</span>'
      + '</div>';
    }).join('');
    return '<div class="acc-items">' + cards + '</div>';
  }

  function renderSidebar() {
    const side = document.getElementById('side');
    const btnGrid = document.getElementById('btn-grid');

    const accHTML = accounts.map(s => {
      const isSel = mode === 'single' && selected === s;
      const inf = accInfo[s] || {};
      const name = inf.name || ('Tela ' + s);
      const a = inf.active, p2 = inf.party2;
      const front = a
        ? '<img class="acc-spr" src="'+spr(a.species, a.shiny)+'" onerror="this.classList.add(\'ph\');this.removeAttribute(\'src\')">'
        : '<span class="acc-spr ph"></span>';
      const back = p2 ? '<img class="acc-spr2" src="'+spr(p2.species, p2.shiny)+'" title="2º da party" onerror="this.style.display=\'none\'">' : '';
      const sprites = '<span class="acc-sprites">' + back + front + '</span>';
      const sub = a ? (esc(a.species) + ' Lv' + a.level) : 'carregando…';   // shiny já fica dourado, não precisa de emote
      const p2line = p2 ? '<span class="acc-p2" title="2º pokémon da party">'
        + esc(p2.species)
        + (p2.xpPct != null ? ' <b>XP ' + p2.xpPct + '%</b>' : '') + '</span>' : '';
      const hunt = inf.hunt ? '<span class="acc-hunt" title="caçando ' + esc(titce(inf.hunt)) + '">🗺 ' + esc(titce(inf.hunt)) + '</span>' : '';
      const low = accLowItems(inf);
      const card = '<button class="acc'+(isSel?' on':'')+(low.length?' low':'')+'" data-slot="'+s+'"'+(low.length?' title="⚠ Item baixo: '+esc(low.join(', '))+'"':'')+'>'
        + '<span class="acc-top"><span class="acc-name">'+esc(name)+'</span>'
          + '<span class="acc-reload" data-reload="'+s+'" title="Recarregar">&#x21bb;</span></span>'
        + '<span class="acc-body">' + sprites
          + '<span class="acc-info"><span class="acc-sub'+(a&&a.shiny?' shiny':'')+'">'+sub+'</span>'+p2line+hunt+'</span>'
        + '</span>'
        + '</button>';
      // o wrap inteiro (card + itens) é o alvo do arrastar — senão o bloco de itens vira zona morta
      return '<div class="acc-wrap" draggable="true" data-wrap="'+s+'">' + card + itemsForAcc(inf) + '</div>';
    }).join('');

    const focusHTML = mode === 'single' && selected
      ? '<div class="focus-info">&#x1f50d; Foco na <b>Tela '+selected+'</b><br>Clique nela de novo ou em "Grade" para voltar ao grid.</div>'
      : '';

    const html = [
      '<div class="side-h"><span class="t">Telas</span><span class="s">'+accounts.length+'/4</span></div>',
      '<div class="acc-list">' + accHTML + '</div>',
      focusHTML,
      accounts.length < 4 ? '<button class="addacc" data-action="add">+ Adicionar tela</button>' : '',
      accounts.length > 0 ? '<div class="game-ctrls"><button class="gcbtn" data-action="remove">✕ Fechar ultima tela</button></div>' : '',
    ].join('');
    side.innerHTML = html;

    // fiação por addEventListener (sem onclick inline no HTML)
    side.querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => { if (boxOpen) toggleBox(false); if (dexOpen) toggleDex(false); if (statsOpen) toggleStats(false); if (P) P.selectAccount(+b.dataset.slot); }));
    side.querySelectorAll('[data-reload]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); if (P) P.reloadGame(+b.dataset.reload); }));

    // arrastar os cards pra reordenar as contas (reordena as telas do jogo junto)
    let dragSlot = null;
    side.querySelectorAll('.acc-wrap').forEach(function(card){
      card.addEventListener('dragstart', function(e){ dragSlot = +card.dataset.wrap; card.classList.add('dragging'); if (e.dataTransfer){ e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(dragSlot)); } catch {} } });
      card.addEventListener('dragend', function(){ card.classList.remove('dragging'); side.querySelectorAll('.acc-wrap.drag-over').forEach(c => c.classList.remove('drag-over')); });
      card.addEventListener('dragover', function(e){ e.preventDefault(); if (e.dataTransfer) e.dataTransfer.dropEffect = 'move'; });
      card.addEventListener('dragenter', function(){ if (+card.dataset.wrap !== dragSlot) card.classList.add('drag-over'); });
      // só tira o realce ao sair do bloco de vez (passar do card pros itens não conta)
      card.addEventListener('dragleave', function(e){ if (!card.contains(e.relatedTarget)) card.classList.remove('drag-over'); });
      card.addEventListener('drop', function(e){
        e.preventDefault(); card.classList.remove('drag-over');
        const from = dragSlot != null ? dragSlot : (e.dataTransfer && +e.dataTransfer.getData('text/plain'));
        const to = +card.dataset.wrap;
        if (from == null || Number.isNaN(from) || from === to) return;
        const order = accounts.slice();
        const fi = order.indexOf(from); if (fi < 0) return;
        order.splice(fi, 1);
        const ti = order.indexOf(to); order.splice(ti < 0 ? order.length : ti, 0, from);
        if (P && P.reorderViews) P.reorderViews(order);   // main reordena as telas e reenvia o payload -> re-render
      });
    });
    const addBtn = side.querySelector('[data-action="add"]'); if (addBtn) addBtn.addEventListener('click', () => { if (P) P.addView(); });
    const rmBtn = side.querySelector('[data-action="remove"]'); if (rmBtn) rmBtn.addEventListener('click', removeLast);

    // mostra/esconde botao de Grade
    if (mode === 'single') {
      btnGrid.style.display = '';
      btnGrid.classList.add('on');
    } else {
      btnGrid.style.display = 'none';
      btnGrid.classList.remove('on');
    }

    // enquanto a box, a pokédex ou as stats estão abertas elas ocupam o #main — não mexer
    if (!boxOpen && !dexOpen && !statsOpen) {
      document.getElementById('main').innerHTML = accounts.length
        ? ''
        : '<div class="empty">Nenhuma tela aberta.<br>Clique em <b>+ Adicionar tela</b> para começar.</div>';
    }
  }

  if (P) {
    P.onAccounts(function(payload) {
      accounts = (payload && payload.slots) ? payload.slots : [];
      selected = (payload && payload.selected) ? payload.selected : null;
      mode = (payload && payload.mode) ? payload.mode : 'grid';
      accInfo = (payload && payload.info) ? payload.info : {};
      renderSidebar();
    });
  }

  document.getElementById('btn-add').onclick = function() { if (P) P.addView(); };
  document.getElementById('btn-box').onclick = function() { toggleBox(); };
  document.getElementById('btn-dex').onclick = function() { toggleDex(); };
  document.getElementById('btn-stats').onclick = function() { toggleStats(); };
  document.getElementById('btn-grid').onclick = function() { if (boxOpen) toggleBox(false); if (dexOpen) toggleDex(false); if (statsOpen) toggleStats(false); if (P) P.setGameMode('grid'); };
  document.getElementById('btn-min').onclick = function() { if (P) P.winMinimize(); };
  document.getElementById('btn-max').onclick = function() { if (P) P.winMaximize(); };
  document.getElementById('btn-close').onclick = function() { if (P) P.winClose(); };

  // ---- versao (na barra) + botao de config (abre o overlay proprio, por cima do jogo) ----
  if (P && P.getVersion) P.getVersion().then(function(v) {
    document.getElementById('app-ver').textContent = 'v' + v;
  });
  document.getElementById('btn-cfg').onclick = function() { if (P && P.toggleConfig) P.toggleConfig(); };
  document.getElementById('btn-side').onclick = function() {
    const off = document.body.classList.toggle('side-off');
    if (P && P.setSidebar) P.setSidebar(off);
  };

  renderSidebar();

  function removeLast() {
    if (accounts.length > 0 && P) P.removeView(accounts[accounts.length - 1]);
  }

  // ---- som ao capturar shiny (a dashView é dona da reprodução; toca mesmo com o config fechado) ----
  let sndEnabled = true, sndVolume = 0.8, sndAudio = null;
  function playSound(dataUrl, volume) {
    const url = dataUrl || (sndAudio && sndAudio.src);
    if (!url) return;
    try { const a = new Audio(url); a.volume = Math.max(0, Math.min(1, volume != null ? volume : sndVolume)); a.play().catch(function(){}); } catch {}
  }
  if (P && P.onSoundConfig) P.onSoundConfig(function(cfg){
    if (!cfg) return;
    sndEnabled = cfg.enabled !== false;
    if (typeof cfg.volume === 'number') sndVolume = cfg.volume;
    if (cfg.dataUrl) { sndAudio = new Audio(cfg.dataUrl); }   // pré-carrega o áudio atual
  });
  if (P && P.onItemConfig) P.onItemConfig(function(p){ if (!p) return; if (p.vis) itemVis = p.vis; if (p.alert) itemAlert = p.alert; renderSidebar(); });   // menu ⚙ > Itens: visibilidade + limite de alerta
  if (P && P.onShinyCaught) P.onShinyCaught(function(){ if (sndEnabled) playSound(null, sndVolume); });
  if (P && P.onPlaySound) P.onPlaySound(function(p){ playSound(p && p.dataUrl, p && p.volume); });   // botão testar (ignora o enabled)
</script>
</body>
</html>
