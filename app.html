<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>PokeDream Launcher</title>
<style>
  :root{
    --bg:#0a0d13; --panel:#111621; --panel2:#161c2a;
    --line:#1f2734; --line2:#2c3648;
    --txt:#e7e9ef; --mut:#8791a4; --gold:#ffce56; --good:#3fca74; --warn:#ffb151;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:var(--bg); color:var(--txt); font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:13px; -webkit-font-smoothing:antialiased; color-scheme:dark; overflow:hidden; }
  .app{ display:flex; flex-direction:column; height:100vh; }
  button{ font-family:inherit; cursor:pointer; }

  .bar{ height:46px; flex:0 0 46px; display:flex; align-items:center; gap:10px; padding:0 8px 0 14px;
    background:var(--panel); border-bottom:1px solid var(--line); -webkit-app-region:drag; z-index:20; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:800; letter-spacing:.3px; font-size:13px; }
  .brand .logo{ width:16px; height:16px; border-radius:50%;
    background:radial-gradient(circle at 50% 33%, #fff 0 25%, #ee4b4b 26% 48%, #17171a 49% 55%, #dcdcdc 56%); box-shadow:0 0 0 1.5px #17171a inset; }
  .brand b{ color:var(--gold); }
  .ver{ font-size:10.5px; font-weight:700; color:var(--mut); background:var(--panel2); border:1px solid var(--line2); padding:1px 7px; border-radius:8px; letter-spacing:0; }
  .bar .sp{ flex:1; }
  .bar button{ -webkit-app-region:no-drag; }
  .tbtn{ height:30px; padding:0 11px; display:flex; align-items:center; gap:6px; border-radius:8px;
    border:1px solid var(--line2); background:var(--panel2); color:var(--txt); font-size:12px; }
  .tbtn:hover{ background:#1a2231; } .tbtn.on{ border-color:var(--gold); color:var(--gold); }
  .ico{ width:32px; height:30px; border:1px solid var(--line); background:transparent; color:var(--mut); border-radius:8px; font-size:14px; }
  .ico:hover{ background:#1a2231; color:var(--txt); } .ico.cl:hover{ background:#7a2130; color:#fff; }

  .body{ display:flex; flex:1; min-height:0; }
  .side{ flex:0 0 220px; border-right:1px solid var(--line); background:#0d121b; padding:12px 10px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  body.side-off .side{ display:none; }
  body.side-off #btn-side{ color:var(--gold); border-color:var(--gold); }
  .side-h{ display:flex; align-items:baseline; justify-content:space-between; padding:2px 4px 6px; }
  .side-h .t{ font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mut); font-weight:700; }
  .side-h .s{ font-size:10.5px; color:#5a6478; }
  .acc-list{ display:flex; flex-direction:column; gap:8px; margin-top:4px; flex:1 1 auto; overflow-y:auto; }
  .acc{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
    border:1px solid var(--line); background:var(--panel); color:var(--txt); cursor:pointer; text-align:left;
    font-size:12.5px; font-weight:700; width:100%; transition:border-color .15s,background .15s; }
  .acc:hover{ background:#1a2231; } .acc.on{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; background:#1a1e0b; }
  .acc-spr{ width:42px; height:42px; flex:0 0 42px; object-fit:contain; image-rendering:pixelated; }
  .acc-spr.ph{ background:var(--panel2); border-radius:8px; border:1px solid var(--line2); }
  .acc-info{ min-width:0; flex:1 1 auto; display:flex; flex-direction:column; gap:1px; }
  .acc-name{ font-weight:700; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acc-sub{ font-weight:400; font-size:10.5px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acc-sub.shiny{ color:var(--gold); font-weight:700; }
  .acc-hunt{ font-weight:400; font-size:10px; color:#5a6478; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .acc-reload{ flex:0 0 auto; color:var(--mut); font-size:15px; padding:3px 6px; border-radius:6px; opacity:0; transition:opacity .12s,color .12s; }
  .acc:hover .acc-reload{ opacity:.85; }
  .acc-reload:hover{ color:var(--warn); background:var(--panel2); opacity:1; }
  .addacc{ margin-top:6px; padding:9px; border-radius:9px; border:1px dashed var(--line2);
    background:transparent; color:var(--mut); font-size:12px; width:100%; }
  .addacc:hover{ color:var(--gold); border-color:var(--gold); }
  .gcbtn{ background:var(--panel2); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:5px 8px; font-size:10.5px; cursor:pointer; width:100%; text-align:center; }
  .gcbtn:hover{ background:#1a2231; border-color:var(--line2); }
  .game-ctrls{ display:flex; flex-direction:column; gap:5px; margin:2px 0 8px; }
  .focus-info{ font-size:10.5px; color:var(--good); padding:6px 8px; border-radius:7px; background:#132216; border:1px solid #1f3a27; margin-top:4px; line-height:1.4; }
  .focus-info b{ color:var(--gold); }

  .main{ flex:1; min-width:0; padding:12px; display:flex; align-items:center; justify-content:center; }
  .empty{ color:var(--mut); font-size:13px; text-align:center; }
  .empty b{ color:var(--gold); }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <button class="ico" id="btn-side" title="Esconder/mostrar a barra lateral">☰</button>
    <span class="brand"><span class="logo"></span>POKEDREAM <b>LAUNCHER</b> <span class="ver" id="app-ver">…</span></span>
    <span class="sp"></span>
    <button class="tbtn" id="btn-grid" style="display:none">▦ Grade</button>
    <button class="tbtn" id="btn-add">+ Adicionar tela</button>
    <button class="ico" id="btn-cfg" title="Configuracoes / Atualizacao">⚙</button>
    <button class="ico" id="btn-min">—</button>
    <button class="ico" id="btn-max">□</button>
    <button class="ico cl" id="btn-close">✕</button>
  </div>
  <div class="body">
    <aside class="side" id="side"></aside>
    <main class="main" id="main"></main>
  </div>
</div>
<script>
  const P = window.poke || null;
  let accounts = [];
  let selected = null;
  let mode = 'grid';
  let accInfo = {};   // { slot: { name, hunt, species, level } } — vem do main pela rede do jogo

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function titce(s){ return String(s||'').replace(/_/g,' ').replace(/\b\w/g, function(c){ return c.toUpperCase(); }); }
  // nome (grafia do pokedream) -> nº da dex nacional, pra usar o sprite ANIMADO (gen-V) do PokeAPI
  const DEX_MAP = {"Bulbasaur":1,"Ivysaur":2,"Venusaur":3,"Charmander":4,"Charmeleon":5,"Charizard":6,"Squirtle":7,"Wartortle":8,"Blastoise":9,"Caterpie":10,"Metapod":11,"Butterfree":12,"Weedle":13,"Kakuna":14,"Beedrill":15,"Pidgey":16,"Pidgeotto":17,"Pidgeot":18,"Rattata":19,"Raticate":20,"Spearow":21,"Fearow":22,"Ekans":23,"Arbok":24,"Pikachu":25,"Raichu":26,"Sandshrew":27,"Sandslash":28,"NidoranF":29,"Nidorina":30,"Nidoqueen":31,"NidoranM":32,"Nidorino":33,"Nidoking":34,"Clefairy":35,"Clefable":36,"Vulpix":37,"Ninetales":38,"Jigglypuff":39,"Wigglytuff":40,"Zubat":41,"Golbat":42,"Oddish":43,"Gloom":44,"Vileplume":45,"Paras":46,"Parasect":47,"Venonat":48,"Venomoth":49,"Diglett":50,"Dugtrio":51,"Meowth":52,"Persian":53,"Psyduck":54,"Golduck":55,"Mankey":56,"Primeape":57,"Growlithe":58,"Arcanine":59,"Poliwag":60,"Poliwhirl":61,"Poliwrath":62,"Abra":63,"Kadabra":64,"Alakazam":65,"Machop":66,"Machoke":67,"Machamp":68,"Bellsprout":69,"Weepinbell":70,"Victreebel":71,"Tentacool":72,"Tentacruel":73,"Geodude":74,"Graveler":75,"Golem":76,"Ponyta":77,"Rapidash":78,"Slowpoke":79,"Slowbro":80,"Magnemite":81,"Magneton":82,"Farfetchd":83,"Doduo":84,"Dodrio":85,"Seel":86,"Dewgong":87,"Grimer":88,"Muk":89,"Shellder":90,"Cloyster":91,"Gastly":92,"Haunter":93,"Gengar":94,"Onix":95,"Drowzee":96,"Hypno":97,"Krabby":98,"Kingler":99,"Voltorb":100,"Electrode":101,"Exeggcute":102,"Exeggutor":103,"Cubone":104,"Marowak":105,"Hitmonlee":106,"Hitmonchan":107,"Lickitung":108,"Koffing":109,"Weezing":110,"Rhyhorn":111,"Rhydon":112,"Chansey":113,"Tangela":114,"Kangaskhan":115,"Horsea":116,"Seadra":117,"Goldeen":118,"Seaking":119,"Staryu":120,"Starmie":121,"MrMime":122,"Scyther":123,"Jynx":124,"Electabuzz":125,"Magmar":126,"Pinsir":127,"Tauros":128,"Magikarp":129,"Gyarados":130,"Lapras":131,"Ditto":132,"Eevee":133,"Vaporeon":134,"Jolteon":135,"Flareon":136,"Porygon":137,"Omanyte":138,"Omastar":139,"Kabuto":140,"Kabutops":141,"Aerodactyl":142,"Snorlax":143,"Dratini":147,"Dragonair":148,"Dragonite":149,"Chikorita":152,"Bayleef":153,"Meganium":154,"Cyndaquil":155,"Quilava":156,"Typhlosion":157,"Totodile":158,"Croconaw":159,"Feraligatr":160,"Sentret":161,"Furret":162,"Hoothoot":163,"Noctowl":164,"Ledyba":165,"Ledian":166,"Spinarak":167,"Ariados":168,"Crobat":169,"Chinchou":170,"Lanturn":171,"Pichu":172,"Cleffa":173,"Igglybuff":174,"Togepi":175,"Togetic":176,"Natu":177,"Xatu":178,"Mareep":179,"Flaaffy":180,"Ampharos":181,"Bellossom":182,"Marill":183,"Azumarill":184,"Sudowoodo":185,"Politoed":186,"Hoppip":187,"Skiploom":188,"Jumpluff":189,"Aipom":190,"Sunkern":191,"Sunflora":192,"Yanma":193,"Wooper":194,"Quagsire":195,"Espeon":196,"Umbreon":197,"Murkrow":198,"Slowking":199,"Misdreavus":200,"Unown":201,"Wobbuffet":202,"Girafarig":203,"Pineco":204,"Forretress":205,"Dunsparce":206,"Gligar":207,"Steelix":208,"Snubbull":209,"Granbull":210,"Qwilfish":211,"Scizor":212,"Shuckle":213,"Heracross":214,"Sneasel":215,"Teddiursa":216,"Ursaring":217,"Slugma":218,"Magcargo":219,"Swinub":220,"Piloswine":221,"Corsola":222,"Remoraid":223,"Octillery":224,"Delibird":225,"Mantine":226,"Skarmory":227,"Houndour":228,"Houndoom":229,"Kingdra":230,"Phanpy":231,"Donphan":232,"Porygon2":233,"Stantler":234,"Smeargle":235,"Tyrogue":236,"Hitmontop":237,"Smoochum":238,"Elekid":239,"Magby":240,"Miltank":241,"Blissey":242,"Larvitar":246,"Pupitar":247,"Tyranitar":248};
  function spr(name, shiny){ const d = name && DEX_MAP[name]; return d ? 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/versions/generation-v/black-white/animated/' + (shiny ? 'shiny/' : '') + d + '.gif' : ''; }

  function renderSidebar() {
    const side = document.getElementById('side');
    const btnGrid = document.getElementById('btn-grid');

    const accHTML = accounts.map(s => {
      const isSel = mode === 'single' && selected === s;
      const inf = accInfo[s] || {};
      const name = inf.name || ('Tela ' + s);
      const a = inf.active;
      const img = a
        ? '<img class="acc-spr" src="'+spr(a.species, a.shiny)+'" onerror="this.classList.add(\'ph\');this.removeAttribute(\'src\')">'
        : '<span class="acc-spr ph"></span>';
      const sub = a ? (esc(a.species) + ' Lv' + a.level + (a.shiny ? ' ✨' : '')) : 'carregando…';
      const hunt = inf.hunt ? '<span class="acc-hunt">🗺 caçando ' + esc(titce(inf.hunt)) + '</span>' : '';
      return '<button class="acc'+(isSel?' on':'')+'" data-slot="'+s+'">'
        + img
        + '<span class="acc-info"><span class="acc-name">'+esc(name)+'</span><span class="acc-sub'+(a&&a.shiny?' shiny':'')+'">'+sub+'</span>'+hunt+'</span>'
        + '<span class="acc-reload" data-reload="'+s+'" title="Recarregar">&#x21bb;</span>'
        + '</button>';
    }).join('');

    const focusHTML = mode === 'single' && selected
      ? '<div class="focus-info">&#x1f50d; Foco na <b>Tela '+selected+'</b><br>Clique nela de novo ou em "Grade" para voltar ao grid.</div>'
      : '';

    const html = [
      '<div class="side-h"><span class="t">Telas</span><span class="s">'+accounts.length+'/4</span></div>',
      '<div class="acc-list">' + accHTML + '</div>',
      focusHTML,
      accounts.length < 4 ? '<button class="addacc" data-action="add">+ Adicionar tela</button>' : '',
      accounts.length > 0 ? '<div class="game-ctrls"><button class="gcbtn" data-action="remove">✕ Fechar ultima tela</button></div>' : '',
    ].join('');
    side.innerHTML = html;

    // fiação por addEventListener (sem onclick inline no HTML)
    side.querySelectorAll('[data-slot]').forEach(b => b.addEventListener('click', () => { if (P) P.selectAccount(+b.dataset.slot); }));
    side.querySelectorAll('[data-reload]').forEach(b => b.addEventListener('click', (e) => { e.stopPropagation(); if (P) P.reloadGame(+b.dataset.reload); }));
    const addBtn = side.querySelector('[data-action="add"]'); if (addBtn) addBtn.addEventListener('click', () => { if (P) P.addView(); });
    const rmBtn = side.querySelector('[data-action="remove"]'); if (rmBtn) rmBtn.addEventListener('click', removeLast);

    // mostra/esconde botao de Grade
    if (mode === 'single') {
      btnGrid.style.display = '';
      btnGrid.classList.add('on');
    } else {
      btnGrid.style.display = 'none';
      btnGrid.classList.remove('on');
    }

    document.getElementById('main').innerHTML = accounts.length
      ? ''
      : '<div class="empty">Nenhuma tela aberta.<br>Clique em <b>+ Adicionar tela</b> para começar.</div>';
  }

  if (P) {
    P.onAccounts(function(payload) {
      accounts = (payload && payload.slots) ? payload.slots : [];
      selected = (payload && payload.selected) ? payload.selected : null;
      mode = (payload && payload.mode) ? payload.mode : 'grid';
      accInfo = (payload && payload.info) ? payload.info : {};
      renderSidebar();
    });
  }

  document.getElementById('btn-add').onclick = function() { if (P) P.addView(); };
  document.getElementById('btn-grid').onclick = function() { if (P) P.setGameMode('grid'); };
  document.getElementById('btn-min').onclick = function() { if (P) P.winMinimize(); };
  document.getElementById('btn-max').onclick = function() { if (P) P.winMaximize(); };
  document.getElementById('btn-close').onclick = function() { if (P) P.winClose(); };

  // ---- versao (na barra) + botao de config (abre o overlay proprio, por cima do jogo) ----
  if (P && P.getVersion) P.getVersion().then(function(v) {
    document.getElementById('app-ver').textContent = 'v' + v;
  });
  document.getElementById('btn-cfg').onclick = function() { if (P && P.toggleConfig) P.toggleConfig(); };
  document.getElementById('btn-side').onclick = function() {
    const off = document.body.classList.toggle('side-off');
    if (P && P.setSidebar) P.setSidebar(off);
  };

  renderSidebar();

  function removeLast() {
    if (accounts.length > 0 && P) P.removeView(accounts[accounts.length - 1]);
  }
</script>
</body>
</html>
